version: "3"

services:
  three-lods-debug:
    build:
      context: ./
      dockerfile: ./Dockerfile-dev
    container_name: three-lod-manager-debug
    ports:
      - "5173:5173"
    volumes:
      - ./src/:/app/src/
      - ./public/:/app/public/
      - ./index.html:/app/index.html
    networks:
      - default
